name: MOVA CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node benchmarks/synthetic-jump.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: API and page smoke
        run: |
          npm run start > /tmp/mova.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/mova.log' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/demo > /dev/null; then break; fi
            sleep 1
          done
          node --test tests/integration/demo-api.test.mjs
