name: MOVA database QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: mova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify schema against disposable PostgreSQL
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          command -v psql
          psql -h 127.0.0.1 -U postgres -d mova_test -v ON_ERROR_STOP=1 -f tests/database/demo-schema.sql
          psql -h 127.0.0.1 -U postgres -d mova_test -v ON_ERROR_STOP=1 -f tests/database/demo-hardening.sql
          createdb -h 127.0.0.1 -U postgres mova_app_v2
          psql -h 127.0.0.1 -U postgres -d mova_app_v2 -v ON_ERROR_STOP=1 -f tests/database/app-v2.sql
